name: Gas Optimization Report

on:
  pull_request:
    branches: [main]
    paths:
      - "stellar-lend/contracts/**"
      - "stellar-lend/benchmarks/**"
      - "stellar-lend/src/benchmarking/**"
      - "scripts/gas_benchmark_report.py"
      - "run-benchmarks.sh"
      - "api/src/scripts/generate-gas-report.ts"
      - "api/src/services/gasReport/**"
      - ".github/workflows/gas-report.yml"
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

jobs:
  gas-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            stellar-lend/target
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci --ignore-scripts

      - name: Run gas benchmarks
        run: |
          cd stellar-lend
          cargo run -p stellarlend-benchmarks --bin run_benchmarks --release -- \
            --output benchmark-results.json

      - name: Generate gas report
        id: gas-report
        working-directory: api
        run: |
          set +e
          npx ts-node --transpile-only src/scripts/generate-gas-report.ts \
            --stellar-lend-dir ../stellar-lend \
            --results ../stellar-lend/benchmark-results.json \
            --out-json ../stellar-lend/gas-report.json \
            --out-md ../stellar-lend/gas-report.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          test -f ../stellar-lend/gas-report.json

      - name: Post report to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const markdown = fs.readFileSync('stellar-lend/gas-report.md', 'utf8');
            const report = JSON.parse(
              fs.readFileSync('stellar-lend/gas-report.json', 'utf8')
            );
            const { measurements, overBudget, regressions } = report.summary;

            const header = regressions > 0 || overBudget > 0
              ? 'Gas regressions detected'
              : 'No gas regressions detected';

            const body = [
              '## Gas Optimization Report',
              '',
              `**${header}**`,
              '',
              `- Scenarios measured: ${measurements}`,
              `- Over budget: ${overBudget}`,
              `- Regressions: ${regressions}`,
              '',
              markdown,
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Upload gas report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gas-report-${{ github.sha }}
          path: |
            stellar-lend/benchmark-results.json
            stellar-lend/gas-report.json
            stellar-lend/gas-report.md

      - name: Fail if gas budget gate failed
        if: always() && steps.gas-report.outputs.exit_code == '1'
        run: exit 1
