name: Gas Optimization Report

on:
  pull_request:
    branches: [main]
    paths:
      - "stellar-lend/contracts/**"
      - "stellar-lend/benchmarks/**"
      - "scripts/gas-report.sh"
      - "run-benchmarks.sh"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/gas-report.yml"
  workflow_dispatch:

jobs:
  gas-report:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            stellar-lend/target
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get base branch baseline
        run: |
          npm run --workspaces=false gas:baseline > /tmp/baseline.json || echo '{}' > /tmp/baseline.json

      - name: Generate current gas report
        run: npm run --workspaces=false gas:report > /tmp/current.json

      - name: Compare gas costs
        run: npm run --workspaces=false gas:compare /tmp/baseline.json /tmp/current.json > /tmp/comparison.md

      - name: Check for regressions
        id: check-regression
        run: |
          set +e
          npm run --workspaces=false gas:check /tmp/comparison.json > /tmp/check_result.json
          CHECK_EXIT=$?
          set -e
          FAILED=$(jq '.failed > 0' /tmp/check_result.json)
          echo "FAILED=$FAILED" >> $GITHUB_OUTPUT
          echo "CHECK_EXIT=$CHECK_EXIT" >> $GITHUB_OUTPUT

      - name: Post report to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comparison = fs.readFileSync('/tmp/comparison.md', 'utf8');
            const checkResult = JSON.parse(fs.readFileSync('/tmp/check_result.json', 'utf8'));

            let status = '✅ No gas regressions detected';
            if (checkResult.regressions > 0) {
              status = `⚠️ ${checkResult.regressions} gas regression(s) detected`;
            }

            const body = `## Gas Optimization Report

${status}

${comparison}

### Summary
- **Functions analyzed**: ${checkResult.total}
- **Improvements**: ${checkResult.improvements}
- **Regressions**: ${checkResult.regressions}
- **Average change**: ${checkResult.average_change > 0 ? '+' : ''}${checkResult.average_change.toFixed(2)}%
`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail if regressions exceed threshold
        if: steps.check-regression.outputs.FAILED == 'true'
        run: exit 1
