name: Property & Invariant Tests

# Issue #686 — property-based fuzzing of deposit/borrow/repay/withdraw with
# protocol invariant checks (stellar-lend/contracts/lending/tests/fuzz_invariants.rs),
# test performance benchmarking, coverage reporting and invariant violation
# alerts. The libFuzzer smoke/invariant jobs in ci-cd.yml cover cargo-fuzz.
#
#   PRs / pushes : PROPTEST_CASES=64   (~2 min)
#   nightly      : PROPTEST_CASES=1024 (deep run; violations open an issue)

on:
  push:
    branches: [main]
    paths:
      - "stellar-lend/contracts/lending/**"
      - "stellar-lend/benchmarks/test-performance-baseline.json"
      - "scripts/testing/**"
      - ".github/workflows/property-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "stellar-lend/contracts/lending/**"
      - "stellar-lend/benchmarks/test-performance-baseline.json"
      - "scripts/testing/**"
      - ".github/workflows/property-tests.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      cases:
        description: "PROPTEST_CASES"
        default: "256"

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  property-tests:
    name: Fuzz + invariants + journeys
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      PROPTEST_CASES: ${{ github.event_name == 'schedule' && '1024' || inputs.cases || '64' }}
      INVARIANT_REPORT_DIR: ${{ github.workspace }}/invariant-violations
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            stellar-lend/target
          key: ${{ runner.os }}-cargo-property-${{ hashFiles('stellar-lend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-property-
            ${{ runner.os }}-cargo-

      - name: Run suites with performance benchmarking
        id: suites
        run: scripts/testing/run-property-suite.sh

      - name: Upload test performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-performance-${{ github.sha }}
          path: stellar-lend/target/test-performance.json
          retention-days: 30

      - name: Upload invariant violations and proptest regressions
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: invariant-violations-${{ github.sha }}
          path: |
            invariant-violations/
            stellar-lend/contracts/lending/tests/*.proptest-regressions
          retention-days: 90
          if-no-files-found: ignore

      - name: Alert on invariant violation
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dir = process.env.INVARIANT_REPORT_DIR;
            const files = fs.existsSync(dir) ? fs.readdirSync(dir).filter(f => f.endsWith('.json')) : [];
            if (!files.length) {
              core.info('Suite failed without an invariant violation report; no alert.');
              return;
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const details = files.map(f => {
              const v = JSON.parse(fs.readFileSync(`${dir}/${f}`, 'utf8'));
              return `### \`${v.invariant}\`\n\n${v.detail}\n\n<details><summary>${v.steps} steps to reproduce</summary>\n\n\`\`\`\n${v.history}\n\`\`\`\n</details>`;
            }).join('\n\n');
            const body = `🚨 **Invariant violation** detected by property tests (PROPTEST_CASES=${process.env.PROPTEST_CASES}) on \`${context.sha.slice(0, 7)}\`.\n\n${details}\n\nRun: ${runUrl} · artifacts: \`invariant-violations-${context.sha}\``;

            if (context.eventName === 'pull_request') {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
              return;
            }
            const label = 'invariant-violation';
            try {
              await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'B60205' });
            } catch (e) { /* already exists */ }
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, labels: label, state: 'open' });
            if (open.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title: 'Invariant violation detected by property tests',
                labels: [label],
                body,
              });
            }

  coverage:
    name: Coverage (lending integration suites)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      PROPTEST_CASES: "16"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('stellar-lend/Cargo.lock') }}

      - name: Coverage for fuzzed entry points
        working-directory: stellar-lend
        run: |
          cargo llvm-cov -p stellarlend-lending \
            --test fuzz_invariants --test user_journeys --test event_topics \
            --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only | tee coverage-summary.txt
          {
            echo "## Lending coverage (integration suites)"
            echo
            echo '```'
            grep -E "lending/src/(deposit|withdraw|borrow|views|dust)\.rs|^TOTAL" coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: lending-coverage-${{ github.sha }}
          path: |
            stellar-lend/lcov.info
            stellar-lend/coverage-summary.txt
          retention-days: 30
