name: SDK Release

# Issues #1441 / #1442 – test, version and publish the client libraries.
#
#   sdk-v<version>     publishes packages/sdk to npm as @stellarlend/sdk
#   client-v<version>  publishes stellar-lend/client to crates.io as stellarlend-client
#
# The tag version must equal the version in package.json / Cargo.toml, so a
# release can only ship what the changelog and manifest describe.

on:
  push:
    branches: ["main"]
    tags: ["sdk-v*", "client-v*"]
    paths:
      - "stellar-lend/client/**"
      - ".github/workflows/sdk-release.yml"
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "stellar-lend/client/**"
      - ".github/workflows/sdk-release.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-client:
    name: Rust client tests and examples
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/sdk-v') }}
    defaults:
      run:
        working-directory: stellar-lend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            stellar-lend/target
          key: ${{ runner.os }}-client-${{ hashFiles('stellar-lend/Cargo.lock') }}
      - run: cargo test -p stellarlend-client
      - run: cargo build -p stellarlend-client --examples

  publish-crate:
    name: Publish stellarlend-client
    runs-on: ubuntu-latest
    needs: rust-client
    if: startsWith(github.ref, 'refs/tags/client-v')
    defaults:
      run:
        working-directory: stellar-lend/client
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches Cargo.toml version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "stellarlend-client") | .version')
          test "client-v${version}" = "${GITHUB_REF_NAME}" \
            || { echo "Tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-npm:
    name: Publish @stellarlend/sdk
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm install --workspaces
      - name: Tag matches package.json version
        run: |
          version=$(node -p "require('./packages/sdk/package.json').version")
          test "sdk-v${version}" = "${GITHUB_REF_NAME}" \
            || { echo "Tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - run: npm run test -w @stellarlend/sdk
      - run: npm run build -w @stellarlend/sdk
      - run: npm publish -w @stellarlend/sdk --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
