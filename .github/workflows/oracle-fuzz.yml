name: Oracle Fuzzing

on:
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "stellar-lend/contracts/oracle-hub/**"
      - "stellar-lend/fuzz/**"
      - ".github/workflows/oracle-fuzz.yml"
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Seconds to fuzz each target (reproducible budget)"
        required: false
        default: "60"
  schedule:
    - cron: "0 3 * * *"

env:
  # Configurable, reproducible fuzz budget. A crash or assertion failure is
  # deterministic given the corpus + seed, so the same budget reproduces it.
  FUZZ_MAX_TOTAL_TIME: ${{ github.event.inputs.max_total_time || '60' }}
  FUZZ_TIMEOUT: "15"
  FUZZ_SEED: "0"
  FUZZ_TARGETS: "oracle_actions oracle_ttl"

jobs:
  oracle-fuzz:
    name: Oracle Hub fuzz smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run oracle fuzz smoke tests
        working-directory: stellar-lend
        run: |
          for target in $FUZZ_TARGETS; do
            echo "::group::fuzz $target"
            cargo +nightly fuzz run "$target" "fuzz/corpus/$target" -- \
              -seed="$FUZZ_SEED" -max_total_time="$FUZZ_MAX_TOTAL_TIME" -timeout="$FUZZ_TIMEOUT"
            echo "::endgroup::"
          done

