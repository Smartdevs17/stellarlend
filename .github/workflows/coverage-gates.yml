name: Contract Coverage Gates

on:
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "stellar-lend/**/*.rs"
      - "stellar-lend/Cargo.toml"
      - "stellar-lend/Cargo.lock"
      - ".github/workflows/coverage-gates.yml"
  workflow_dispatch:

jobs:
  coverage:
    name: Contracts - coverage threshold
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stellar-lend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run coverage gate
        run: cargo llvm-cov --workspace --all-features --fail-under-lines 70 --fail-under-functions 70 --fail-under-regions 70 --lcov --output-path coverage.lcov

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: stellar-lend-coverage
          path: stellar-lend/coverage.lcov