[advisories]
version = 2
# Keep vulnerability advisories fatal, but do not fail CI on unmaintained
# transitive dependencies with no safe upgrade path from Soroban/Ark.
unmaintained = "workspace"
unsound = "workspace"
yanked = "warn"
ignore = [
    # Fix requires crypto-bigint 0.7, which is not compatible with the
    # Soroban SDK's k256/elliptic-curve 0.13 dependency chain.
    "RUSTSEC-2026-0387",
]

[bans]
multiple-versions = "warn"
