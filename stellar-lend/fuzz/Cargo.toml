[package]
name = "stellarlend-contract-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# The fuzz crate is intentionally outside the main `stellar-lend` workspace so
# its nightly-only, standalone dependency graph never leaks into a normal
# `cargo build`. Declaring the empty workspace here stops cargo from walking up
# to an unrelated ancestor workspace.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
soroban-sdk = { version = "23.4.1", features = ["testutils"] }

# Contracts under test
stellarlend-lending = { path = "../contracts/lending", features = ["testutils"] }
stellarlend-amm = { path = "../contracts/amm", features = ["testutils"] }
bridge = { path = "../contracts/bridge", features = ["testutils"] }
stellarlend-hello-world = { package = "hello-world", path = "../contracts/hello-world" }
stellarlend-oracle-hub = { package = "oracle-hub", path = "../contracts/oracle-hub" }

[[bin]]
name = "lending_actions"
path = "fuzz_targets/lending_actions.rs"
test = false
doc = false

[[bin]]
name = "lending_critical"
path = "fuzz_targets/lending_critical.rs"
test = false
doc = false

[[bin]]
name = "amm_actions"
path = "fuzz_targets/amm_actions.rs"
test = false
doc = false

[[bin]]
name = "bridge_actions"
path = "fuzz_targets/bridge_actions.rs"
test = false
doc = false

[[bin]]
name = "governance_actions"
path = "fuzz_targets/governance_actions.rs"
test = false
doc = false

[[bin]]
name = "oracle_actions"
path = "fuzz_targets/oracle_actions.rs"
test = false
doc = false

[[bin]]
name = "oracle_ttl"
path = "fuzz_targets/oracle_ttl.rs"
test = false
doc = false
