name: Gas Benchmarks

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run benchmark suite
        env:
          BENCH_DIR: benchmarks
          LATEST: benchmarks/latest.json
        run: |
          cargo run --bin run_benchmarks -- --output benchmarks/latest.json
          python3 scripts/gas-report.sh || true
      # Regressions on main are not fatal; the scheduled run re-baselines.
      - name: Capture signed-off measurements
        run: |
          printf 'Sourced bench run — update committed baselines after review.\n'

      - name: Commit updated history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/history.json benchmarks/latest.json || true
          git diff --cached --quiet || git commit -m "ci: update gas benchmark history [skip ci]"
          git push