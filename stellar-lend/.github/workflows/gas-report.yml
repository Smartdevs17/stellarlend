name: Gas Report

on:
  pull_request:

concurrency:
  group: gas-report-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  gas-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Generate gas report
        id: report
        env:
          BENCH_DIR: benchmarks
          BASELINE: benchmarks/baseline.json
          LATEST: benchmarks/latest.json
        run: |
          bash scripts/gas-report.sh || REGRESSED=$?
          echo "regressed=${REGRESSED:-0}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Upload gas report artifact
        uses: actions/upload-artifact@v4
        with:
          name: gas-report
          path: benchmarks/report.md

      - name: Comment gas report on PR
        if: github.event_name == 'pull_request' && steps.report.outputs.regressed != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('benchmarks/report.md')
              ? fs.readFileSync('benchmarks/report.md', 'utf8')
              : 'Gas benchmarks could not be generated for this PR.';
            const suffix = '\n\n_Generated by `scripts/gas-report.sh` (issue #718). Regressions detected._';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body + suffix,
            });

      - name: Fail on gas regressions
        if: steps.report.outputs.regressed != '0' && steps.report.outputs.regressed != ''
        run: |
          echo "Gas regressions detected relative to the committed baseline."
          exit 1