[package]
name = "stellarlend-rate-limit"
version = "0.1.0"
edition = "2021"
publish = false
description = "Shared policy-based rate limiting library for StellarLend contracts (issue #704)"

[lib]
path = "src/lib.rs"

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
