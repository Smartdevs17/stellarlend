[package]
name = "oracle-hub"
version = "0.1.0"
edition = "2021"
description = "Centralized Oracle Hub: pluggable price providers, median/weighted aggregation, health monitoring, emergency freeze, and upgradeable governance"

[dependencies]
soroban-sdk = { workspace = true }
soroban-token-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
