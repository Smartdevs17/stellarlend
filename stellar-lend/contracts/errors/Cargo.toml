[package]
name = "stellarlend-errors"
version = "0.1.0"
edition = "2021"
publish = false
description = "Unified error handling framework for StellarLend contracts (issue #708)"

[lib]
path = "src/lib.rs"

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
