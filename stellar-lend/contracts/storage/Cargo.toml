[package]
name = "stellarlend-storage"
version = "0.1.0"
edition = "2021"

[dependencies]
soroban-sdk = { version = "23.4.1" }
serde = { version = "1.0", features = ["derive"] }

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
debug = 0
strip = "symbols"
debug-assertions = false
overflow-checks = true
lto = true
panic = "abort"
codegen-units = 1
